<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
           
        }
       .acc{
        width: 40%;
        height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color:rgba(245, 245, 245, 0.836);
        border-radius: 5px;
        
       }
       .acc .acc-box{
        width: 80%;
       }
       .acc .acc-box input{
        width:100% ;
        height: 30px;
        border: none;
        outline: none;
        border-radius: 15px;
        padding: 10px;
        background: rgb(222, 241, 253);
        box-shadow: inset 0 0 10px grey;
        margin: 6px;
       }
       .acc  button{
        width: 100%;
        height: 4vh;
        background-color:rgb(39, 39, 211) ;
        border-radius: 6px;
        color: white;
        font-size: medium;
       margin: 6px;
       }
       
     
        
    </style>
</head>

<body>
    <div class="acc">
        <div class="acc-box">
            <h1 style="margin-top: 15px; margin-left: 15vh; margin-bottom: 4vh;">Create Account</h1>
            <input type="text" placeholder=" 👤Full Name"><br>
            <input type="email" placeholder="Email ID"><br>
            <input type="Phone" placeholder="Phone Number"><br>
            <input type="password" placeholder="🔒Password"><br>
             <button>SignUp</button>
        <div class="acc-last" style="display: flex;align-items: center; gap: 15px; justify-content: center;">
            <p>Already have an account?</p>
            <a href="index.html">Login</a>
        </div>
        </div>
       
    </div>
</body>

</html>
